<!DOCTYPE html>
<html lang="ko">
{% include 'common/header.html' %}
<body>

{% include 'common/topbar.html' %}

<div class="dash-header">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-3">
        <div>
            <h2>내 프로필</h2>
            <p>계정 정보와 활동 통계를 확인하고 수정합니다.</p>
        </div>
        <div><a href="/emp_dash" class="btn btn-light rounded-pill px-4 shadow-sm"><i class="fas fa-arrow-left me-2"></i>돌아가기</a></div>
    </div>
</div>

<div class="container pb-5 mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <!-- 활동 통계 -->
            <div class="row g-3 mb-4">
                <div class="col-4">
                    <div class="stat-card text-center">
                        <div class="stat-info">
                            <p>작성 글</p>
                            <h3>{{ my_post_count }}</h3>
                        </div>
                    </div>
                </div>
                <div class="col-4">
                    <div class="stat-card text-center">
                        <div class="stat-info">
                            <p>작성 댓글</p>
                            <h3>{{ my_comment_count }}</h3>
                        </div>
                    </div>
                </div>
                <div class="col-4">
                    <div class="stat-card text-center">
                        <div class="stat-info">
                            <p>완료 업무</p>
                            <h3>{{ my_done_count }}</h3>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 프로필 정보 + 수정 폼 -->
            <div class="content-card">
                <div class="card-title mb-4"><span><i class="fas fa-user-circle me-2 text-primary"></i>계정 정보</span></div>

                {% if success %}
                <div class="alert alert-success py-2 small">정보가 수정되었습니다.</div>
                {% endif %}

                <form action="/api/profile" method="POST">
                    <div class="mb-3 row">
                        <label class="col-sm-3 col-form-label fw-bold">아이디</label>
                        <div class="col-sm-9">
                            <input type="text" class="form-control" value="{{ user.username }}" disabled>
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <label class="col-sm-3 col-form-label fw-bold">권한</label>
                        <div class="col-sm-9">
                            <input type="text" class="form-control" value="{{ user.role }}" disabled>
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <label class="col-sm-3 col-form-label fw-bold">이름 <span class="text-danger">*</span></label>
                        <div class="col-sm-9">
                            <input type="text" class="form-control" name="name" value="{{ user.name }}" required>
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <label class="col-sm-3 col-form-label fw-bold">부서</label>
                        <div class="col-sm-9">
                            <select class="form-select" name="dept">
                                {% for d in ['경영지원팀', '개발팀', '디자인팀', '영업팀'] %}
                                <option value="{{ d }}" {% if user.dept == d %}selected{% endif %}>{{ d }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="mb-3 row">
                        <label class="col-sm-3 col-form-label fw-bold">연락처</label>
                        <div class="col-sm-9">
                            <input type="text" class="form-control" name="phone" value="{{ user.phone }}">
                        </div>
                    </div>
                    <div class="d-flex justify-content-end">
                        <button type="submit" class="btn btn-primary px-5"><i class="fas fa-save me-2"></i>저장</button>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>

<footer class="footer">
    <div class="container">
        <div class="footer-menu mb-4">
            <a href="/about">소개</a><a href="/contact">문의하기</a><a href="/accessibility">접근성</a>
        </div>
        <p class="mb-0 opacity-50 small">&copy; 2024 Wno1. All Rights Reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
{% include 'common/header.html' %}
<body>

{% include 'common/topbar.html' %}

<div class="dash-header">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-3">
        <div>
            <h2>지원서 작성</h2>
            <p>{{ jp.title }} — {{ jp.company }}</p>
        </div>
        <div>
            <a href="/resume/{{ jp.id }}" class="btn btn-light rounded-pill px-4 shadow-sm">
                <i class="fas fa-arrow-left me-2"></i>공고로 돌아가기
            </a>
        </div>
    </div>
</div>

<div class="list-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="content-card">
                    <h5 class="fw-bold mb-4"><i class="fas fa-file-alt me-2 text-primary"></i>지원서 정보를 입력해주세요</h5>

                    <form action="/api/job_apply/{{ jp.id }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-bold">이름 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="name" value="{{ user_name }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">이메일 <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" name="email" placeholder="example@email.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">연락처 <span class="text-danger">*</span></label>
                            <input type="tel" class="form-control" name="phone" value="{{ user_phone }}" placeholder="010-0000-0000" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">자기소개서</label>
                            <textarea class="form-control" name="cover_letter" rows="8"
                                placeholder="지원 동기, 직무 관련 경험, 장점 등을 자유롭게 작성해주세요."></textarea>
                            <div class="form-text">최대 2,000자 이내 권장</div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center">
                            <a href="/resume/{{ jp.id }}" class="btn btn-light px-4">취소</a>
                            <button type="submit" class="btn btn-primary rounded-pill px-5">
                                <i class="fas fa-paper-plane me-2"></i>지원서 제출
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="footer">
    <div class="container">
        <div class="footer-menu mb-4">
            <a href="/faq">소개</a>
            <a href="/contact">문의하기</a>
            <a href="/accessibility">접근성</a>
        </div>
        <div class="social-icons mb-4">
            <a href="#"><i class="fab fa-facebook-f"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-youtube"></i></a>
        </div>
        <p class="mb-0 opacity-50 small">&copy; 2024 Wno1. All Rights Reserved.</p>
    </div>
</footer>

</body>
</html>

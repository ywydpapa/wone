<!DOCTYPE html>
<html lang="ko">
{% include 'common/header.html' %}
<body>

{% include 'common/topbar.html' %}

<div class="dash-header">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-3">
        <div>
            <h2>1:1 문의하기</h2>
            <p>궁금한 점이나 불편사항을 문의해 주세요.</p>
        </div>
        <div><a href="/" class="btn btn-light rounded-pill px-4 shadow-sm"><i class="fas fa-arrow-left me-2"></i>홈으로</a></div>
    </div>
</div>

<div class="container pb-5 mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="content-card">
                <div class="card-title mb-4"><span><i class="fas fa-envelope me-2 text-primary"></i>문의 접수</span></div>
                <form action="/submit_as_request" method="POST">
                    <input type="hidden" name="asUrgency" value="normal">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">문의 분류</label>
                        <select class="form-select" name="asCategory" required>
                            <option value="">분류를 선택하세요</option>
                            <option value="inquiry_system">시스템 오류/불편</option>
                            <option value="inquiry_account">계정/권한 문의</option>
                            <option value="inquiry_erp">ERP 사용 문의</option>
                            <option value="inquiry_a11y">접근성 지원 요청</option>
                            <option value="inquiry_etc">기타 문의</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">제목</label>
                        <input type="text" class="form-control" name="asTitle" placeholder="문의 제목을 입력하세요" required maxlength="100">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">내용</label>
                        <textarea class="form-control" name="asDetails" rows="6" placeholder="문의 내용을 자세히 작성해 주세요" required></textarea>
                    </div>
                    <div class="d-flex gap-2 justify-content-end">
                        <a href="/" class="btn btn-outline-secondary px-4">취소</a>
                        <button type="submit" class="btn btn-primary px-5">접수하기</button>
                    </div>
                </form>
            </div>

            <div class="content-card mt-4">
                <div class="card-title mb-3"><span><i class="fas fa-info-circle me-2 text-primary"></i>안내</span></div>
                <ul class="small text-muted mb-0 ps-3">
                    <li class="mb-1">문의는 영업일 기준 1~2일 내 담당자가 연락드립니다.</li>
                    <li class="mb-1">긴급한 문의는 내선 <strong>119</strong>로 직접 연락하세요.</li>
                    <li>접수 내역은 <a href="/contact">AS/문의 내역</a> 페이지에서 확인하실 수 있습니다.</li>
                </ul>
            </div>
        </div>
    </div>
</div>

</body>
</html>

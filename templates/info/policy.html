<!DOCTYPE html>
<html lang="ko">
{% include 'common/header.html' %}
<body>

{% include 'common/topbar.html' %}

<div class="dash-header">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-3">
        <div>
            <h2>{{ page_title }}</h2>
            <p>{{ subtitle }}</p>
        </div>
        <div><a href="/" class="btn btn-light rounded-pill px-4 shadow-sm"><i class="fas fa-arrow-left me-2"></i>홈으로</a></div>
    </div>
</div>

<div class="container pb-5 mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="content-card">
                <p class="text-muted small mb-4">시행일: {{ effective_date }}</p>
                {% for article in articles %}
                <div class="mb-4">
                    <h6 class="fw-bold text-dark">{{ loop.index }}. {{ article.title }}</h6>
                    <p class="small text-muted mb-0">{{ article.body }}</p>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>

{% include "common/_footer.html" %}
</body>
</html>
